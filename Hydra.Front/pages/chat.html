<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra · Assistente IA</title>
    <link rel="icon" type="image/png" href="../img/logo-hydra.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/controle-estoque.css">
    <link rel="stylesheet" href="../css/gerenciar-usuarios.css">
    <link rel="stylesheet" href="../css/public-demo.css">
    <link rel="stylesheet" href="../css/font-size.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>

<body>

    <!-- Reaproveita o escopo .hydro-stock (sidebar, topbar, cores) das demais telas -->
    <div class="hydro-stock">

        <button class="hydro-mobile-toggle" id="hydroMobileToggle" aria-label="Abrir menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
        <div class="hydro-sidebar-overlay" id="hydroSidebarOverlay"></div>

        <div class="hydro-app">

            <aside class="hydro-sidebar" id="hydroSidebar">
                <a class="hydro-brand" href="controle-estoque.html" aria-label="Ir para o início">
                    <img src="../img/logo-hydra.png" alt="Hydra PDV">
                </a>

                <nav class="hydro-menu">
                    <p class="hydro-menu-label">Menu</p>
                    <ul>
                        <li><a href="controle-estoque.html" data-view="estoque"><i
                                    class="hydro-ic hydro-ic-inventory"></i><span>Estoque</span></a></li>
                        <li><a href="caixa.html" data-view="caixa"><i
                                    class="hydro-ic hydro-ic-drawer"></i><span>Vendas</span></a></li>
                        <li><a href="dashboard.html" data-view="dashboard"><i
                                    class="hydro-ic hydro-ic-home"></i><span>Relatório</span></a></li>
                        <li><a href="chat.html" class="hydro-active" data-view="assistente"><i
                                    class="hydro-ic hydro-ic-home"></i><span>Assistente IA</span></a></li>
                    </ul>
                </nav>

                <div class="hydro-menu hydro-menu-admin">
                    <p class="hydro-menu-label" id="hydroMenuAdminLabel"><span class="hydro-menu-restricted">Admin</span></p>
                    <ul>
                        <li id="hydroLiEquipe"><a href="gerenciar-usuarios.html"><i
                                    class="hydro-ic hydro-ic-users"></i><span>Equipe</span></a></li>
                        <li id="hydroLiConfig"><a href="configuracoes-loja.html"><i
                                    class="hydro-ic hydro-ic-gear"></i><span>Configuração Loja</span></a></li>
                    </ul>
                </div>

                <div class="hydro-menu hydro-menu-bottom">
                    <p class="hydro-menu-label">Geral</p>
                    <ul>
                        <li><a href="login.html" data-view="sair"><i class="hydro-ic hydro-ic-exit"></i><span>Sair</span></a>
                        </li>
                    </ul>
                </div>
            </aside>

            <main class="hydro-main">
                <header class="hydro-topbar">
                    <h1>Assistente IA</h1>
                    <div class="hydro-topbar-actions">
                        <a class="hydro-icon-btn" href="configuracoes-loja.html" aria-label="Configuração Loja"><i
                                class="hydro-ic hydro-ic-gear"></i></a>
                        <button class="hydro-icon-btn" aria-label="Notificações">
                            <i class="hydro-ic hydro-ic-bell"></i>
                            <span class="hydro-notif-dot"></span>
                        </button>
                        <div class="hydro-user">
                            <img class="hydro-avatar" src="https://i.pravatar.cc/64?img=13" alt="Foto do usuário">
                            <span class="hydro-user-name" id="hydroUserName"></span>
                        </div>
                    </div>
                </header>

                <section class="hydro-table-card hydro-chat-card">
                    <div class="hydro-chat-messages" id="chat-mensagens" aria-live="polite"></div>

                    <div class="hydro-chat-suggestions" id="chat-sugestoes">
                        <button type="button" data-pergunta="Quais são os 5 produtos mais vendidos?">Mais vendidos</button>
                        <button type="button" data-pergunta="Quais produtos estão com estoque baixo?">Estoque baixo</button>
                        <button type="button" data-pergunta="Quais produtos vencem nos próximos 7 dias?">Vencendo em 7 dias</button>
                        <button type="button" data-pergunta="Quais produtos estão parados, sem vendas?">Produtos parados</button>
                    </div>

                    <form class="hydro-chat-form" id="chat-form">
                        <input type="text" id="chat-input" placeholder="Pergunte sobre o estoque..." autocomplete="off" required>
                        <button type="submit" class="hydro-btn hydro-btn-primary" id="chat-enviar">Enviar</button>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <div class="accessibility-widget">
        <button id="font-plus" data-font-action="increase">A+</button>
        <button id="font-minus" data-font-action="decrease">A−</button>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/public-demo.js"></script>
    <script src="../js/font-size.js"></script>
    <script src="../js/chat.js"></script>
</body>

</html>
