<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra · Produtos</title>
    <link rel="icon" type="image/png" href="../img/logo-hydra.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/produtos.css">
    <link rel="stylesheet" href="../css/public-demo.css">
    <link rel="stylesheet" href="../css/font-size.css">
</head>

<body>

    <!-- Tudo isolado dentro de .hydro-products para não colidir com o CSS/JS do restante do sistema -->
    <div class="hydro-products">

        <button class="hydro-mobile-toggle" id="hydroMobileToggle" aria-label="Abrir menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
        <div class="hydro-sidebar-overlay" id="hydroSidebarOverlay"></div>

        <div class="hydro-app">

            <!-- Sidebar -->
            <aside class="hydro-sidebar" id="hydroSidebar">
                    <a class="hydro-brand" href="controle-estoque.html" aria-label="Ir para o início">
                    <img src="../img/logo-hydra.png" alt="Hydra PDV">
                </a>

                <nav class="hydro-menu">
                    <p class="hydro-menu-label">Menu</p>
                    <ul>
                        <li><a href="controle-estoque.html" class="hydro-active" data-view="estoque"><i
                                    class="hydro-ic hydro-ic-inventory"></i><span>Estoque</span></a></li>
                        <li><a href="caixa.html" data-view="caixa"><i class="hydro-ic hydro-ic-drawer"></i><span>Vendas</span></a>
                        </li>
                        <li><a href="dashboard.html" data-view="dashboard"><i
                                    class="hydro-ic hydro-ic-home"></i><span>Relatório</span></a></li>
                        <li><a href="chat.html" data-view="assistente"><i class="hydro-ic hydro-ic-home"></i><span>Assistente IA</span></a></li>
                    </ul>
                </nav>

                <div class="hydro-menu hydro-menu-admin">
                    <p class="hydro-menu-label"><span class="hydro-menu-restricted">Admin</span></p>
                    <ul>
                        <li id="hydroLiEquipe"><a href="gerenciar-usuarios.html"><i
                                    class="hydro-ic hydro-ic-users"></i><span>Equipe</span></a></li>
                        <li id="hydroLiConfig"><a href="configuracoes-loja.html"><i
                                    class="hydro-ic hydro-ic-gear"></i><span>Configuração Loja</span></a></li>
                    </ul>
                </div>

                <div class="hydro-menu hydro-menu-bottom">
                    <p class="hydro-menu-label">Geral</p>
                    <ul>
                        <li><a href="login.html" data-view="sair"><i class="hydro-ic hydro-ic-exit"></i><span>Sair</span></a>
                        </li>
                    </ul>
                </div>
            </aside>

            <!-- Main -->
            <main class="hydro-main">
                <header class="hydro-topbar">
                    <div class="hydro-breadcrumb">
                        <a class="hydro-breadcrumb-muted" href="controle-estoque.html">Estoque</a>
                        <span class="hydro-breadcrumb-sep">&gt;</span>
                        <span class="hydro-breadcrumb-current">Novo Produto</span>
                    </div>
                    <div class="hydro-topbar-actions">
                        <div class="hydro-search">
                            <i class="hydro-ic hydro-ic-search"></i>
                            <input type="text" id="hydroSearchInput" placeholder="Buscar">
                        </div>
                        <button class="hydro-icon-btn" aria-label="Notificações">
                            <i class="hydro-ic hydro-ic-bell"></i>
                            <span class="hydro-notif-dot"></span>
                        </button>
                        <div class="hydro-user">
                            <img class="hydro-avatar" src="https://i.pravatar.cc/64?img=13" alt="Foto do usuário">
                            <span class="hydro-user-name" id="hydroUserName"></span>
                        </div>
                    </div>
                </header>

                <form class="hydro-product-layout" id="hydroProductForm" novalidate>

                    <!-- Card do formulário -->
                    <section class="hydro-card hydro-form-card">
                        <div class="hydro-card-heading">
                            <h2>Novo Produto</h2>
                            <p>Preencha as informações do produto para cadastrá-lo no sistema.</p>
                        </div>

                        <div class="hydro-form-group">
                            <label for="hydroProdName">Nome do produto</label>
                            <input type="text" id="hydroProdName" name="nome" placeholder="Ex.: Arroz Tipo 1 5kg" required>
                            <span class="hydro-field-error" data-error-for="hydroProdName"></span>
                        </div>

                        <div class="hydro-form-row">
                            <div class="hydro-form-group">
                                <label for="hydroProdBarcode">Código de barras</label>
                                <input type="text" id="hydroProdBarcode" name="codigoBarras" placeholder="Ex.: 7891000100103" inputmode="numeric">
                            </div>
                            <div class="hydro-form-group">
                                <label for="hydroProdCategory">Categoria</label>
                                <select id="hydroProdCategory" name="categoria" required>
                                    <option value="" selected disabled>Selecione</option>
                                    <option value="alimentos">Alimentos</option>
                                    <option value="bebidas">Bebidas</option>
                                    <option value="limpeza">Limpeza</option>
                                    <option value="higiene">Higiene e beleza</option>
                                    <option value="outros">Outros</option>
                                </select>
                                <span class="hydro-field-error" data-error-for="hydroProdCategory"></span>
                            </div>
                        </div>

                        <div class="hydro-form-row">
                            <div class="hydro-form-group">
                                <label for="hydroProdCostPrice">Preço de custo</label>
                                <div class="hydro-input-prefix">
                                    <span>R$</span>
                                    <input type="number" id="hydroProdCostPrice" name="precoCusto" placeholder="0,00" min="0" step="0.01">
                                </div>
                            </div>
                            <div class="hydro-form-group">
                                <label for="hydroProdSalePrice">Preço de venda</label>
                                <div class="hydro-input-prefix">
                                    <span>R$</span>
                                    <input type="number" id="hydroProdSalePrice" name="precoVenda" placeholder="0,00" min="0" step="0.01" required>
                                </div>
                                <span class="hydro-field-error" data-error-for="hydroProdSalePrice"></span>
                            </div>
                        </div>

                        <div class="hydro-form-row">
                            <div class="hydro-form-group">
                                <label for="hydroProdQty">Quantidade em estoque</label>
                                <input type="number" id="hydroProdQty" name="quantidade" placeholder="0" min="0" step="1" required>
                                <span class="hydro-field-error" data-error-for="hydroProdQty"></span>
                            </div>
                            <div class="hydro-form-group">
                                <label for="hydroProdMinStock">Estoque mínimo</label>
                                <input type="number" id="hydroProdMinStock" name="estoqueMinimo" placeholder="0" min="0" step="1">
                            </div>
                        </div>

                        <div class="hydro-form-group">
                            <label for="hydroProdExpiry">Validade (opcional)</label>
                            <input type="date" id="hydroProdExpiry" name="validade">
                        </div>

                        <div class="hydro-form-group">
                            <label for="hydroProdUnit">Unidade</label>
                            <select id="hydroProdUnit" name="unidade">
                                <option value="un" selected>Unidade (un)</option>
                                <option value="kg">Quilograma (kg)</option>
                                <option value="g">Grama (g)</option>
                                <option value="l">Litro (l)</option>
                                <option value="ml">Mililitro (ml)</option>
                                <option value="cx">Caixa (cx)</option>
                                <option value="pct">Pacote (pct)</option>
                            </select>
                        </div>
                    </section>

                    <!-- Card de imagem -->
                    <section class="hydro-card hydro-image-card">
                        <label class="hydro-dropzone" id="hydroDropzone" for="hydroProdImageInput">
                            <div class="hydro-dropzone-preview" id="hydroDropzonePreview" hidden>
                                <img id="hydroDropzoneImg" alt="Pré-visualização do produto">
                            </div>
                            <div class="hydro-dropzone-empty" id="hydroDropzoneEmpty">
                                <span class="hydro-dropzone-icon"><i class="hydro-ic hydro-ic-upload"></i></span>
                                <p class="hydro-dropzone-title">Adicionar imagem do produto</p>
                                <p class="hydro-dropzone-sub">Arraste e solte uma imagem aqui<br>ou clique para selecionar</p>
                                <span class="hydro-btn hydro-btn-outline hydro-btn-sm hydro-dropzone-btn">
                                    <i class="hydro-ic hydro-ic-image"></i> Selecionar imagem
                                </span>
                            </div>
                            <input type="file" id="hydroProdImageInput" accept="image/png, image/jpeg, image/webp" hidden>
                        </label>
                        <button type="button" class="hydro-dropzone-remove" id="hydroDropzoneRemove" hidden>
                            <i class="hydro-ic hydro-ic-trash"></i> Remover imagem
                        </button>
                    </section>

                    <!-- Barra de ações -->
                    <div class="hydro-form-actions">
                        <a href="controle-estoque.html" class="hydro-btn hydro-btn-outline">Cancelar</a>
                        <button type="submit" class="hydro-btn hydro-btn-primary" id="hydroSaveBtn">
                            <i class="hydro-ic hydro-ic-save"></i> Salvar
                        </button>
                    </div>
                </form>
            </main>
        </div>

        <div class="hydro-toast" id="hydroToast"></div>

    </div>

    <div class="accessibility-widget">
        <button id="font-plus" data-font-action="increase">A+</button>
        <button id="font-minus" data-font-action="decrease">A−</button>
    </div>

    <script src="../js/hydro-store.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/hydro-sync.js"></script>
    <script src="../js/public-demo.js"></script>
    <script src="../js/font-size.js"></script>
    <script src="../js/produtos.js"></script>
</body>

</html>
